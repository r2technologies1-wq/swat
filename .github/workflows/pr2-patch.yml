name: Apply PR2 trainer brain patch

on:
  push:
    branches: [trainer-brain-v2]
    paths:
      - "scripts/pr2_patch.py"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trainer-brain-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply trainer brain patch
        run: python scripts/pr2_patch.py
      - name: Install dependencies
        run: npm install
      - name: Check trainer API syntax
        run: node --check api/trainer.js
      - name: Build app
        run: npm run build
      - name: Commit generated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CornerbackProject.jsx
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Build always-on trainer memory experience"
          git push origin HEAD:trainer-brain-v2
