name: Apply Ready to Train patch

on:
  push:
    branches:
      - trainer-ready-v1
    paths:
      - "scripts/ready_train_patch.py"
      - ".github/workflows/ready-train-patch.yml"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trainer-ready-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply trainer patch
        run: python scripts/ready_train_patch.py

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit generated trainer changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CornerbackProject.jsx
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Build Ready to Train trainer experience"
          git push origin HEAD:trainer-ready-v1
